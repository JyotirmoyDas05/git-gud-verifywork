name: Merge contributor PR

# pull_request_target runs with repository secrets and write access, so this
# workflow MUST NOT check out or execute any code from the pull request.
# It only reads the changed-file list through the API, merges, and then
# rebuilds from the base branch. Contributor input is a filename and never
# reaches a shell.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "contributors/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Rebuilding index.html is a commit to main. Every workflow that pushes to
  # main shares this group so they queue instead of racing into a
  # non-fast-forward push.
  group: main-push
  cancel-in-progress: false

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quilt

      - name: Build the patch generator
        run: cargo build --release --manifest-path tools/quilt/Cargo.toml

      - name: Check the pull request only adds what it should
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');

            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const folded = author.toLowerCase();

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { ...context.repo, pull_number: pr.number, per_page: 100 },
            );

            const fail = async (reason) => {
              core.setOutput('ok', 'false');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: `Thanks for the pull request! It can't be merged automatically yet:\n\n> ${reason}\n\n`
                  + `It should add your contributor file \`contributors/add-${author}.txt\` — plus, if @gitgud-verifybot has already sent it, your quilt patch \`contributors/art/${folded}.svg\`. Nothing else.\n\n`
                  + `Fix it up and push again; this check runs on every push.`,
              });
              core.notice(`Rejected: ${reason}`);
            };

            // A learner's branch legitimately carries two files by the time
            // they open a pull request: the one they wrote, and the quilt
            // patch the bot pushed in challenge 9.
            const txtPath = `contributors/add-${folded}.txt`;
            const artPath = `contributors/art/${folded}.svg`;

            let sawTxt = false;
            let sawArt = false;

            for (const file of files) {
              if (file.status !== 'added') {
                return fail(`\`${file.filename}\` is ${file.status}, and this should only ever add files.`);
              }

              // GitHub usernames are case-insensitive-unique, so one account
              // cannot be both "Ana" and "ana". Fold before comparing rather
              // than demanding a spelling the challenge never asked for.
              const name = file.filename.toLowerCase();

              if (name === txtPath) { sawTxt = true; continue; }

              if (name === artPath) {
                // The patch is deterministic, so anything that is not exactly
                // what the generator produces for this username was not put
                // there by the bot. Without this, any learner could publish an
                // arbitrary image onto the public quilt.
                const expected = execFileSync('tools/quilt/target/release/quilt', [folded], { encoding: 'utf8' }).trim();
                const blob = await github.rest.git.getBlob({
                  ...context.repo, file_sha: file.sha,
                });
                const actual = Buffer.from(blob.data.content, 'base64').toString('utf8').trim();
                if (actual !== expected) {
                  return fail(`\`${file.filename}\` is not the patch @gitgud-verifybot generated for you. Delete it and pull again.`);
                }
                sawArt = true;
                continue;
              }

              return fail(`\`${file.filename}\` does not belong in this pull request.`);
            }

            if (!sawTxt) {
              return fail(`No \`contributors/add-${author}.txt\` in this pull request.`);
            }

            core.info(`Accepted: txt=${sawTxt} art=${sawArt}`);
            core.setOutput('ok', 'true');

      - name: Merge
        if: steps.check.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          # GITHUB_TOKEN returns 403 here even with contents+pull-requests
          # write. The bot is a collaborator on this repo, so use its token -
          # which also makes the merge show up as the bot, matching the story
          # the challenges tell.
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            await github.rest.pulls.merge({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
            });

      - name: Check out the base branch
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # build-index.mjs reads commit dates, so it needs real history.
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT }}

      - name: Rebuild index.html and contributors.json
        if: steps.check.outputs.ok == 'true'
        run: node scripts/build-index.mjs

      - name: Commit the rebuild
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html contributors.json
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "Rebuild contributor list [skip ci]"
          git push
