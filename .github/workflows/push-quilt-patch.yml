name: Push quilt patches

# Challenge 8 asks the learner to give the bot collaborator access; challenge 9
# asks them to pull down what the collaborator did. Without this workflow the
# bot never writes anything, so challenge 8 has no payoff and challenge 9's
# "pull the changes" passes while nothing was ever pulled.
#
# Each learner gets a deterministic quilt block generated from their username.
# Every block goes up on the Pages site, tiled into one communal quilt.
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quilt-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quilt

      - name: Build the patch generator
        run: cargo build --release --manifest-path tools/quilt/Cargo.toml

      - name: Generate and push a patch for each collaborator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PAT }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const REPO = 'git-gud-verifywork';
            const BIN = 'tools/quilt/target/release/quilt';

            const { collaborators = [] } = JSON.parse(
              fs.readFileSync('collaborators.json', 'utf8'),
            );

            for (const { username } of collaborators) {
              try {
                // Their branch is named after their GitHub username, whose
                // capitalisation we do not know here — collaborators.json
                // stores it folded. Branch names are case-sensitive, so find
                // the real one rather than guessing.
                const branches = await github.paginate(
                  github.rest.repos.listBranches,
                  { owner: username, repo: REPO, per_page: 100 },
                );
                const branch = branches.find((b) => /^add-/i.test(b.name));
                if (!branch) {
                  core.info(`${username}: no add-* branch yet, skipping.`);
                  continue;
                }

                const path = `contributors/art/${username}.svg`;

                // Already placed? Do nothing. Regenerating would rewrite their
                // branch on every run and hand them a phantom commit to pull
                // forever.
                try {
                  await github.rest.repos.getContent({
                    owner: username, repo: REPO, path, ref: branch.name,
                  });
                  core.info(`${username}: patch already there.`);
                  continue;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }

                const svg = execFileSync(BIN, [username], { encoding: 'utf8' });

                await github.rest.repos.createOrUpdateFileContents({
                  owner: username,
                  repo: REPO,
                  path,
                  branch: branch.name,
                  message: `Add ${username}'s quilt patch\n\nGenerated by @gitgud-verifybot for Git Gud challenge 9.`,
                  content: Buffer.from(svg).toString('base64'),
                });

                core.notice(`${username}: pushed a patch to ${branch.name}.`);
              } catch (e) {
                // One learner's fork being private, renamed, or deleted must
                // not stop everyone else's patch from going out.
                core.warning(`${username}: ${e.status ?? ''} ${e.message}`);
              }
            }
